    <title>Petualangan Belajar Interactive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d'
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-fredoka {
            font-family: 'Fredoka', sans-serif;
        }
        .arcade-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .arcade-btn:active {
            transform: scale(0.96);
        }
        .option-btn.correct {
            background-color: #10b981 !important;
            border-color: #059669 !important;
            color: #ffffff !important;
        }
        .option-btn.wrong {
            background-color: #f43f5e !important;
            border-color: #e11d48 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 transition-colors duration-300">

    <div id="app-card" class="w-full max-w-2xl bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-4 sm:p-8 shadow-2xl relative overflow-hidden transition-colors duration-300">
        
        <!-- TOP HEADER NAVBAR -->
        <header class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800/80">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-gamepad text-xl"></i>
                </div>
                <div>
                    <h1 class="font-fredoka text-lg sm:text-xl text-slate-800 dark:text-white leading-none">Petualangan Belajar</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Interactive Learning Game</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="btn-back-menu" onclick="goToMenu()" class="hidden py-2 px-3 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-fredoka flex items-center gap-2 transition">
                    <i class="fa-solid fa-house"></i>
                    <span data-i18n="backMenuBtn">Menu</span>
                </button>
                <button onclick="openSettingsModal()" class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </header>

        <!-- MAIN HUB SCREEN -->
        <div id="screen-hub" class="space-y-6">
            <!-- Subject Navigation Tabs -->
            <div class="grid grid-cols-3 gap-2 p-1.5 bg-slate-200 dark:bg-slate-950/80 rounded-2xl border border-slate-300 dark:border-slate-800/80">
                <button id="subj-tab-math" onclick="selectSubject('math')" class="py-3 px-2 rounded-xl font-fredoka text-xs sm:text-sm flex flex-col sm:flex-row items-center justify-center gap-1.5 transition-all bg-indigo-600 text-white border border-indigo-400/40 shadow-md">
                    <i class="fa-solid fa-calculator text-base"></i>
                    <span data-i18n="mathTab">Matematika</span>
                </button>
                <button id="subj-tab-indo" onclick="selectSubject('indo')" class="py-3 px-2 rounded-xl font-fredoka text-xs sm:text-sm flex flex-col sm:flex-row items-center justify-center gap-1.5 transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                    <i class="fa-solid fa-book text-base"></i>
                    <span data-i18n="indoTab">B. Indonesia</span>
                </button>
                <button id="subj-tab-eng" onclick="selectSubject('eng')" class="py-3 px-2 rounded-xl font-fredoka text-xs sm:text-sm flex flex-col sm:flex-row items-center justify-center gap-1.5 transition-all text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                    <i class="fa-solid fa-language text-base"></i>
                    <span data-i18n="engTab">B. Inggris</span>
                </button>
            </div>

            <!-- Level Selector Title -->
            <div class="flex items-center justify-between">
                <h2 class="font-fredoka text-slate-800 dark:text-white text-base sm:text-lg flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-indigo-500 dark:text-indigo-400"></i>
                    <span data-i18n="selectLevelTitle">Pilih Tingkat Kesulitan</span>
                </h2>
            </div>

            <!-- Level Quest Buttons Container -->
            <div id="level-quest-list" class="grid grid-cols-1 gap-3.5">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- GAME ARENA SCREEN -->
        <div id="screen-arena" class="hidden space-y-5">
            <!-- HUD Stats -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-100 dark:bg-slate-950/60 p-3 rounded-2xl border border-slate-300 dark:border-slate-800 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-500 font-bold text-sm">
                        ⭐
                    </div>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-500 dark:text-slate-400" data-i18n="scoreLabel">Skor</div>
                        <div id="hud-score" class="font-fredoka text-lg text-slate-800 dark:text-white leading-none">0</div>
                    </div>
                </div>

                <div class="bg-slate-100 dark:bg-slate-950/60 p-3 rounded-2xl border border-slate-300 dark:border-slate-800 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-500 font-bold text-sm">
                        🔥
                    </div>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-500 dark:text-slate-400" data-i18n="streakLabel">Streak</div>
                        <div id="hud-streak" class="font-fredoka text-lg text-slate-800 dark:text-white leading-none">0</div>
                    </div>
                </div>

                <div class="bg-slate-100 dark:bg-slate-950/60 p-3 rounded-2xl border border-slate-300 dark:border-slate-800 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-500 dark:text-indigo-400 font-bold text-sm">
                        🎯
                    </div>
                    <div>
                        <div class="text-[10px] uppercase font-bold text-slate-500 dark:text-slate-400" data-i18n="progressLabel">Soal</div>
                        <div id="hud-progress" class="font-fredoka text-lg text-slate-800 dark:text-white leading-none">1/10</div>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-300 dark:border-slate-800">
                <div id="arena-progress-bar" class="h-full bg-indigo-500 rounded-full transition-all duration-300 w-0"></div>
            </div>

            <!-- Question Card -->
            <div class="bg-slate-100 dark:bg-slate-950/80 border border-slate-300 dark:border-slate-800/80 rounded-3xl p-6 text-center space-y-4">
                <div id="question-visual-box" class="hidden min-h-[50px] flex items-center justify-center gap-2"></div>
                <div id="question-text-content" class="font-fredoka text-xl sm:text-2xl text-slate-800 dark:text-white min-h-[60px] flex items-center justify-center">
                    Loading Question...
                </div>
            </div>

            <!-- Options Grid -->
            <div id="arena-options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Generated by JS -->
            </div>

            <!-- Feedback Msg -->
            <div id="arena-feedback" class="text-center font-fredoka text-sm sm:text-base min-h-[30px] flex items-center justify-center"></div>
        </div>

        <div id="screen-summary" class="hidden text-center space-y-6 py-4">
            <div class="w-20 h-20 rounded-3xl bg-amber-500/10 border border-amber-500/30 text-amber-500 flex items-center justify-center text-4xl mx-auto">
                🏆
            </div>
            <div>

                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400" data-i18n="summarySubtitle">Kerja bagus, tetap semangat belajar!</p>
            </div>

            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto">

                    <div id="summary-score" class="font-fredoka text-2xl text-indigo-600 dark:text-indigo-400">0</div>
                </div>
                <div class="bg-slate-100 dark:bg-slate-950/80 p-4 rounded-2xl border border-slate-300 dark:border-slate-800">
                    <div class="text-xs text-slate-500 dark:text-slate-400" data-i18n="accuracyLabel">Akurasi</div>
                    <div id="summary-accuracy" class="font-fredoka text-2xl text-emerald-500">0%</div>
                </div>
            </div>

            <div class="flex items-center justify-center gap-3 pt-2">

                    <i class="fa-solid fa-rotate-right"></i>
                    <span data-i18n="retryBtn">Coba Lagi</span>
                </button>
                <button onclick="goToMenu()" class="py-3 px-6 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white rounded-2xl font-fredoka text-sm arcade-btn flex items-center gap-2">
                    <i class="fa-solid fa-list"></i>
                    <span data-i18n="levelListBtn">Daftar Level</span>
                </button>
            </div>
        </div>

    </div>

    <!-- MODAL SETTINGS -->
    <div id="modal-settings" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 space-y-6 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h3 class="font-fredoka text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span data-i18n="settingsTitle">Pengaturan Game</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Theme Toggle Option inside Settings -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider" data-i18n="themeLabel">Tampilan Mode</label>
                <button onclick="toggleTheme()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3.5 rounded-2xl flex items-center justify-between text-white transition">
                    <div class="flex items-center gap-3">
                        <i id="theme-icon" class="fa-solid fa-moon text-indigo-400"></i>
                        <span id="theme-status-text" class="font-fredoka text-sm">Mode Gelap</span>
                    </div>
                    <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-lg font-mono" data-i18n="toggleThemeBtn">Ganti</span>
                </button>
            </div>

            <!-- Language Settings -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider" data-i18n="languageLabel">Bahasa Aplikasi</label>
                <div class="grid grid-cols-2 gap-3">
                    <button id="lang-btn-id" onclick="setAppLanguage('id')" class="py-2.5 px-3 rounded-xl font-fredoka text-sm border flex items-center justify-center gap-2 bg-indigo-600/30 border-indigo-500 text-indigo-300">
                        🇮🇩 Indonesia
                    </button>
                    <button id="lang-btn-en" onclick="setAppLanguage('en')" class="py-2.5 px-3 rounded-xl font-fredoka text-sm border flex items-center justify-center gap-2 bg-slate-800 border-slate-700 text-slate-400">
                        🇬🇧 English
                    </button>
                </div>
            </div>

            <!-- Volume Settings -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs">
                    <span class="font-semibold text-slate-400 uppercase tracking-wider" data-i18n="volumeLabel">Volume Suara</span>
                    <span id="volume-indicator" class="text-indigo-400 font-mono">100%</span>
                </div>
                <input type="range" min="0" max="100" value="100" oninput="changeVolume(this.value)" class="w-full accent-indigo-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <button onclick="closeSettingsModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-fredoka text-sm transition">
                <span data-i18n="closeBtn">Simpan & Tutup</span>
            </button>
        </div>
    </div>

        // Theme Toggle Functionality
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            applyTheme();
        }

        function applyTheme() {
            const html = document.documentElement;
            const appCard = document.getElementById('app-card');
            const icon = document.getElementById('theme-icon');
            const statusText = document.getElementById('theme-status-text');

            if (isDarkMode) {
                html.classList.add('dark');
                document.body.classList.remove('bg-slate-100', 'text-slate-900');
                document.body.classList.add('bg-slate-950', 'text-slate-100');
                
                if (appCard) {
                    appCard.classList.remove('bg-white', 'border-slate-200');
                    appCard.classList.add('bg-slate-900/90', 'border-slate-800');
                }

                if (icon) icon.className = "fa-solid fa-moon text-indigo-400";
                if (statusText) statusText.innerText = translations[currentLang].darkModeText || "Mode Gelap";
            } else {
                html.classList.remove('dark');
                document.body.classList.remove('bg-slate-950', 'text-slate-100');
                document.body.classList.add('bg-slate-100', 'text-slate-900');
                
                if (appCard) {
                    appCard.classList.remove('bg-slate-900/90', 'border-slate-800');
                    appCard.classList.add('bg-white', 'border-slate-200');
                }

                if (icon) icon.className = "fa-solid fa-sun text-amber-500";
                if (statusText) statusText.innerText = translations[currentLang].lightModeText || "Mode Terang";
            }

            if (!document.getElementById('screen-hub').classList.contains('hidden')) {
                renderLevelCards();
            }
        }

                <button onclick="startQuiz(${lvl})" class="w-full bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 border-2 border-slate-300 dark:border-slate-800 hover:border-indigo-500/60 p-4 rounded-2xl text-left arcade-btn flex items-center justify-between group transition">
                    <div class="flex items-center gap-3.5">
                        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-xl group-hover:scale-110 transition">
                            ${subjectIcons[idx]}
                        </div>
                        <div>
                            <div class="font-fredoka text-base text-slate-800 dark:text-white flex items-center gap-2">
                                <span>Tingkat ${lvl}: ${lvlTitles[idx]}</span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${lvlDescs[idx]}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-circle-play text-xl text-indigo-500 dark:text-indigo-400 group-hover:scale-110 transition"></i>
                </button>
            `).join('');
        }

        function selectSubject(subj) {
            currentSubject = subj;
            
            ['math', 'indo', 'eng'].forEach(s => {
                const tab = document.getElementById(`subj-tab-${s}`);
                if (s === subj) {
                    tab.className = "py-3 px-2 rounded-xl font-fredoka text-xs sm:text-sm flex flex-col sm:flex-row items-center justify-center gap-1.5 transition-all bg-indigo-600 text-white border border-indigo-400/40 shadow-md";
                } else {
                    tab.className = "py-3 px-2 rounded-xl font-fredoka text-xs sm:text-sm flex flex-col sm:flex-row items-center justify-center gap-1.5 transition-all text-slate-400 hover:text-slate-200";
                }
            });

            renderLevelCards();
        }

        function generateMathQuestion(lvl) {
            let qText = "";
            let answer = 0;
            let visual = null;

            if (lvl === 1) {
                const icon = visualIcons[Math.floor(Math.random() * visualIcons.length)];
                if (Math.random() < 0.5) {
                    const n1 = Math.floor(Math.random() * 8) + 1;
                    const n2 = Math.floor(Math.random() * 6) + 1;
                    answer = n1 + n2;
                    qText = `${n1} + ${n2} = ?`;
                    visual = { type: 'add', n1, n2, icon };
                } else {
                    const n1 = Math.floor(Math.random() * 8) + 4;
                    const n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    answer = n1 - n2;
                    qText = `${n1} - ${n2} = ?`;
                    visual = { type: 'sub', n1, n2, icon };
                }
            } else if (lvl === 2) {
                const randType = Math.random();
                if (randType < 0.33) {
                    const n1 = Math.floor(Math.random() * 40) + 10;
                    const n2 = Math.floor(Math.random() * 30) + 5;
                    answer = n1 + n2;
                    qText = `${n1} + ${n2} = ?`;
                } else if (randType < 0.66) {
                    const n1 = Math.floor(Math.random() * 10) + 2;
                    const n2 = Math.floor(Math.random() * 9) + 2;
                    answer = n1 * n2;
                    qText = `${n1} × ${n2} = ?`;
                } else {
                    const n2 = Math.floor(Math.random() * 9) + 2;
                    const ansTemp = Math.floor(Math.random() * 9) + 2;
                    const n1 = n2 * ansTemp;
                    answer = ansTemp;
                    qText = `${n1} ÷ ${n2} = ?`;
                }
            } else if (lvl === 3) {
                const randType = Math.random();
                if (randType < 0.33) {
                    const x = Math.floor(Math.random() * 10) + 1;
                    const a = Math.floor(Math.random() * 5) + 2;
                    const b = Math.floor(Math.random() * 10) + 1;
                    answer = x;
                    qText = `<span class="text-xs text-slate-400 block mb-1">Cari nilai x:</span> ${a}x + ${b} = ${(a*x)+b}`;
                } else if (randType < 0.66) {
                    const sq = Math.floor(Math.random() * 12) + 2;
                    const add = Math.floor(Math.random() * 20) + 2;
                    answer = sq + add;
                    qText = `√${sq * sq} + ${add} = ?`;
                } else {
                    const total = (Math.floor(Math.random() * 8) + 1) * 100;
                    const pct = (Math.floor(Math.random() * 5) + 1) * 10;
                    answer = (total * pct) / 100;
                    qText = `${pct}% dari ${total} adalah...`;
                }
            } else {
                const randType = Math.random();
                if (randType < 0.4) {
                    const base = Math.floor(Math.random() * 4) + 2;
                    const exp = Math.floor(Math.random() * 3) + 2;
                    answer = exp;
                    qText = `<span class="text-xs text-slate-400 block mb-1">Logaritma:</span> <sup>${base}</sup>log(${Math.pow(base, exp)}) = ?`;
                } else if (randType < 0.7) {
                    const a = Math.floor(Math.random() * 6) + 2;
                    const b = Math.floor(Math.random() * 3) + 2;
                    answer = Math.pow(a, b);
                    qText = `<span class="text-xs text-slate-400 block mb-1">Eksponen:</span> ${a}<sup>${b}</sup> = ?`;
                } else {
                    const x1 = Math.floor(Math.random() * 5) + 1;
                    const x2 = Math.floor(Math.random() * 5) + 1;
                    const sum = x1 + x2;
                    const prod = x1 * x2;
                    answer = x1;
                    qText = `<span class="text-xs text-slate-400 block mb-1">Akar Persamaan Kuadrat (x<sup>2</sup> - ${sum}x + ${prod} = 0):</span> Salah satu nilai x = ?`;
                }
            }

            const opts = new Set([answer]);
            while (opts.size < 4) {
                let fake = answer + (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                if (fake >= 0) opts.add(fake);
            }

            return {
                text: qText,
                answer,
                options: Array.from(opts).sort(() => Math.random() - 0.5),
                visual
            };
        }

        function getNextQuestion() {
            let qObj = null;

            if (currentSubject === 'math') {
                qObj = generateMathQuestion(currentLevel);
            } else {
                const bank = questionBanks[currentSubject][`level${currentLevel}`];
                let unused = bank.filter(q => !usedHistoryKeys.has(q.q));
                if (unused.length === 0) {
                    usedHistoryKeys.clear();
                    unused = bank;
                }
                const selected = unused[Math.floor(Math.random() * unused.length)];
                usedHistoryKeys.add(selected.q);

                qObj = {
                    text: selected.q,
                    answer: selected.a,
                    options: [...selected.opts].sort(() => Math.random() - 0.5),
                    visual: selected.icon ? { type: 'icon', icon: selected.icon } : null
                };
            }

            return qObj;
        }

        function showScreen(id) {
            ['screen-hub', 'screen-arena', 'screen-summary'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');

            const backBtn = document.getElementById('btn-back-menu');
            if (id === 'screen-hub') {
                backBtn.classList.add('hidden');
            } else {
                backBtn.classList.remove('hidden');
            }
        }

        function startQuiz(lvl) {
            currentLevel = lvl;
            score = 0;
            streak = 0;
            questionIndex = 0;
            correctCount = 0;
            usedHistoryKeys.clear();

            showScreen('screen-arena');
            renderQuestion();
        }

        function updateHUD() {
            document.getElementById('hud-score').innerText = score;
            document.getElementById('hud-streak').innerText = streak;
            document.getElementById('hud-progress').innerText = `${questionIndex + 1}/${maxQuestions}`;
            const pct = Math.min(100, Math.round(((questionIndex) / maxQuestions) * 100));
            document.getElementById('arena-progress-bar').style.width = `${pct}%`;
        }

        function renderQuestion() {
            if (questionIndex >= maxQuestions) {
                showSummary();
                return;
            }

            updateHUD();
            currentQuestion = getNextQuestion();

            const visBox = document.getElementById('question-visual-box');
            if (currentQuestion.visual) {
                visBox.classList.remove('hidden');
                if (currentQuestion.visual.type === 'add') {
                    visBox.innerHTML = `<span class="text-2xl">${Array(currentQuestion.visual.n1).fill(currentQuestion.visual.icon).join(' ')}</span> <span class="text-indigo-400 font-bold mx-1">+</span> <span class="text-2xl">${Array(currentQuestion.visual.n2).fill(currentQuestion.visual.icon).join(' ')}</span>`;
                } else if (currentQuestion.visual.type === 'sub') {
                    visBox.innerHTML = `<span class="text-2xl">${Array(currentQuestion.visual.n1).fill(currentQuestion.visual.icon).join(' ')}</span> <span class="text-indigo-400 font-bold mx-1">-</span> <span class="text-2xl">${Array(currentQuestion.visual.n2).fill(currentQuestion.visual.icon).join(' ')}</span>`;
                } else if (currentQuestion.visual.type === 'icon') {
                    visBox.innerHTML = `<span class="text-4xl">${currentQuestion.visual.icon}</span>`;
                }
            } else {
                visBox.classList.add('hidden');
                visBox.innerHTML = '';
            }

            document.getElementById('question-text-content').innerHTML = currentQuestion.text;

            const grid = document.getElementById('arena-options-grid');
            grid.innerHTML = '';

            currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 border-2 border-slate-300 dark:border-slate-800 hover:border-indigo-500/60 p-4 rounded-2xl font-fredoka text-lg text-slate-800 dark:text-white arcade-btn min-h-[60px] flex items-center justify-center";
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });

            document.getElementById('arena-feedback').innerText = '';
        }

        function checkAnswer(selectedOpt, btnEl) {
            const allBtns = document.querySelectorAll('#arena-options-grid button');
            allBtns.forEach(b => b.disabled = true);

            const isCorrect = String(selectedOpt).trim() === String(currentQuestion.answer).trim();

            if (isCorrect) {
                playSound('correct');
                btnEl.classList.add('correct');
                score += 10 + (streak * 2);
                streak++;
                correctCount++;

                document.getElementById('arena-feedback').innerText = translations[currentLang].correctMsg;
                document.getElementById('arena-feedback').className = "mt-4 text-center font-fredoka text-sm sm:text-base min-h-[30px] flex items-center justify-center text-emerald-400 animate-bounce";
            } else {
                playSound('wrong');
                btnEl.classList.add('wrong');
                streak = 0;

                allBtns.forEach(b => {
                    if (String(b.innerText).trim() === String(currentQuestion.answer).trim()) {
                        b.classList.add('correct');
                    }
                });

                document.getElementById('arena-feedback').innerText = `${translations[currentLang].wrongMsg} ${currentQuestion.answer}`;
                document.getElementById('arena-feedback').className = "mt-4 text-center font-fredoka text-sm sm:text-base min-h-[30px] flex items-center justify-center text-rose-400";
            }

            questionIndex++;
            setTimeout(() => {
                renderQuestion();
            }, 1200);
        }

        function showSummary() {
            playSound('win');
            showScreen('screen-summary');

            const accuracy = Math.round((correctCount / maxQuestions) * 100);
            document.getElementById('summary-score').innerText = score;
            document.getElementById('summary-accuracy').innerText = `${accuracy}%`;

            if (accuracy >= 80) {
                try { confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } }); } catch(e){}
            }
        }

        function playSound(type) {
            if (soundVolume <= 0) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(soundVolume * 0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(soundVolume * 0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                }

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        function retryCurrentLevel() {
            startQuiz(currentLevel);
        }

        function goToMenu() {
            showScreen('screen-hub');
            renderLevelCards();
        }

        function openSettingsModal() {
            document.getElementById('modal-settings').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('modal-settings').classList.add('hidden');
        }

        function setAppLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });

            applyTheme();

            const btnId = document.getElementById('lang-btn-id');
            const btnEn = document.getElementById('lang-btn-en');
            if (lang === 'id') {
                btnId.className = "py-2.5 px-3 rounded-xl font-fredoka text-sm border flex items-center justify-center gap-2 bg-indigo-600/30 border-indigo-500 text-indigo-300";
                btnEn.className = "py-2.5 px-3 rounded-xl font-fredoka text-sm border flex items-center justify-center gap-2 bg-slate-800 border-slate-700 text-slate-400";
            } else {
                btnEn.className = "py-2.5 px-3 rounded-xl font-fredoka text-sm border flex items-center justify-center gap-2 bg-indigo-600/30 border-indigo-500 text-indigo-300";
                btnId.className = "py-2.5 px-3 rounded-xl font-fredoka text-sm border flex items-center justify-center gap-2 bg-slate-800 border-slate-700 text-slate-400";
            }

            renderLevelCards();
        }

        function changeVolume(val) {
            soundVolume = val / 100;
            document.getElementById('volume-indicator').innerText = `${val}%`;
        }

        window.onload = function() {
            renderLevelCards();
        };
    </script>
</body>
</html>
